name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      core_ref:
        description: Exact 40-hex python-hwpx candidate commit
        required: true
        type: string
      automation_ref:
        description: Exact 40-hex python-hwpx-automation candidate commit
        required: true
        type: string
      automation_repository:
        description: Source repository (pre-rename default is hwpx-mcp-server)
        required: false
        default: airmang/hwpx-mcp-server
        type: string

permissions:
  contents: read

jobs:
  plugin-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hwpx-skill
      - name: Require explicit candidate refs
        env:
          CORE_CANDIDATE_REF: ${{ inputs.core_ref || vars.HWPX_CORE_CANDIDATE_REF }}
          AUTOMATION_CANDIDATE_REF: ${{ inputs.automation_ref || vars.HWPX_AUTOMATION_CANDIDATE_REF }}
        run: |
          test -n "${CORE_CANDIDATE_REF}" || {
            echo "::error::Set workflow input core_ref or HWPX_CORE_CANDIDATE_REF to the reviewed candidate commit."
            exit 2
          }
          test -n "${AUTOMATION_CANDIDATE_REF}" || {
            echo "::error::Set workflow input automation_ref or HWPX_AUTOMATION_CANDIDATE_REF to the reviewed candidate commit."
            exit 2
          }
          [[ "${CORE_CANDIDATE_REF}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::core_ref must be an exact lowercase 40-hex commit, not a branch or guessed SHA."
            exit 2
          }
          [[ "${AUTOMATION_CANDIDATE_REF}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::automation_ref must be an exact lowercase 40-hex commit, not a branch or guessed SHA."
            exit 2
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: airmang/python-hwpx
          ref: ${{ inputs.core_ref || vars.HWPX_CORE_CANDIDATE_REF }}
          path: python-hwpx
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.automation_repository || vars.HWPX_AUTOMATION_CANDIDATE_REPOSITORY || 'airmang/hwpx-mcp-server' }}
          ref: ${{ inputs.automation_ref || vars.HWPX_AUTOMATION_CANDIDATE_REF }}
          path: python-hwpx-automation
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv pip install --system -e './python-hwpx[preview]' -e './python-hwpx-automation[mcp,oracle,test]' 'ruff>=0.12'
      - name: Check public repository hygiene
        working-directory: hwpx-skill
        run: python scripts/check_public_hygiene.py
      - name: Run first-stage Ruff gate
        working-directory: hwpx-skill
        run: ruff check --select E9,F .
      - name: Parse shipped Python and Markdown code
        working-directory: hwpx-skill
        run: python scripts/validate_shipped_code.py
      - name: ToolSpec generated files are current
        run: python python-hwpx-automation/scripts/render_tool_contract.py --check
      - name: Skill tests
        working-directory: hwpx-skill
        run: python -m pytest -q
      - name: Build and validate all host bundles
        working-directory: hwpx-skill
        run: |
          python scripts/build_hwpx_plugins.py
          python scripts/validate_hwpx_plugin.py
          git diff --exit-code
      - name: Plugin launcher protocol E2E (editable stack)
        working-directory: hwpx-skill
        run: python scripts/plugin_mcp_e2e.py --automation-repo ../python-hwpx-automation --core-repo ../python-hwpx
      - name: Clean wheel 3-stack smoke
        working-directory: hwpx-skill
        run: python scripts/clean_install_smoke.py --automation-repo ../python-hwpx-automation --core-repo ../python-hwpx
      - name: Generate tested-runtime SBOM
        run: |
          uv venv .sbom-runtime
          uv pip install --python .sbom-runtime/bin/python -e './python-hwpx[preview]' -e './python-hwpx-automation[mcp,oracle]'
          mkdir -p hwpx-skill/artifacts
          uvx --from "cyclonedx-bom==7.3.0" cyclonedx-py environment .sbom-runtime/bin/python \
            --pyproject python-hwpx-automation/pyproject.toml \
            --mc-type application \
            --output-reproducible \
            --output-format JSON \
            --output-file hwpx-skill/artifacts/hwpx-plugin-tested-runtime.cdx.json
      - name: Upload tested-runtime SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hwpx-plugin-tested-runtime-sbom
          path: hwpx-skill/artifacts/hwpx-plugin-tested-runtime.cdx.json
