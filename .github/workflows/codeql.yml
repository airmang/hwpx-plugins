name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 18 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@592d162ba3b2f5a3411d2cbf01df9f82c492f269 # v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@592d162ba3b2f5a3411d2cbf01df9f82c492f269 # v4
        with:
          category: /language:python
