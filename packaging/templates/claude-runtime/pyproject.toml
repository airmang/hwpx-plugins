# Locked runtime for the Claude Code plugin's MCP server.
# Pins follow packaging/product-identity.json (currentVersion); regenerate
# uv.lock with `uv lock --project packaging/templates/claude-runtime` after a bump.
[project]
name = "hwpx-plugin-claude-runtime"
version = "0"
requires-python = "==3.12.*"
dependencies = [
    "python-hwpx-automation[mcp,oracle]==7.3.4",
    "python-hwpx[preview]==6.7.0",
]

# Not installed into the MCP server's environment (uv syncs only the default groups):
# locked here so scripts/vendor_claude_engine.py can vendor it, sha256-pinned, into
# the skill's engine for Python 3.10 hosts, where python-hwpx-automation needs tomli.
[dependency-groups]
chat-engine = ["tomli==2.4.1"]

[tool.uv]
package = false
