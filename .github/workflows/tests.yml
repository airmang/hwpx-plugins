name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: hwpx-skill
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: airmang/python-hwpx
          ref: bf1f52cb380962ffab397ad916538eed7fcba505
          path: python-hwpx
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: airmang/hwpx-mcp-server
          ref: 42d071eb7a2aa9eec33cb60e9c11e1ed5582402e
          path: hwpx-mcp-server
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: uv pip install --system -e ./python-hwpx -e './hwpx-mcp-server[test]' 'ruff>=0.12'
      - name: Check public repository hygiene
        working-directory: hwpx-skill
        run: python scripts/check_public_hygiene.py
      - name: Run first-stage Ruff gate
        working-directory: hwpx-skill
        run: ruff check --select E9,F .
      - name: ToolSpec generated files are current
        run: python hwpx-mcp-server/scripts/render_tool_contract.py --check
      - name: Skill tests
        working-directory: hwpx-skill
        run: python -m pytest -q
      - name: Build and validate all host bundles
        working-directory: hwpx-skill
        run: |
          python scripts/build_hwpx_plugins.py
          python scripts/validate_hwpx_plugin.py
          git diff --exit-code
      - name: Plugin launcher protocol E2E (editable stack)
        working-directory: hwpx-skill
        run: python scripts/plugin_mcp_e2e.py --mcp-repo ../hwpx-mcp-server --core-repo ../python-hwpx
      - name: Clean wheel 3-stack smoke
        working-directory: hwpx-skill
        run: python scripts/clean_install_smoke.py
      - name: Generate tested-runtime SBOM
        run: |
          uv venv .sbom-runtime
          uv pip install --python .sbom-runtime/bin/python -e ./python-hwpx -e ./hwpx-mcp-server
          mkdir -p hwpx-skill/artifacts
          uvx --from "cyclonedx-bom==7.3.0" cyclonedx-py environment .sbom-runtime/bin/python \
            --pyproject hwpx-mcp-server/pyproject.toml \
            --mc-type application \
            --output-reproducible \
            --output-format JSON \
            --output-file hwpx-skill/artifacts/hwpx-plugin-tested-runtime.cdx.json
      - name: Upload tested-runtime SBOM
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hwpx-plugin-tested-runtime-sbom
          path: hwpx-skill/artifacts/hwpx-plugin-tested-runtime.cdx.json
